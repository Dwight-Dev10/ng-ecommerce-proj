
name: Build and deploy ASP.NET Core API to Azure Web App - ng-ecommerce-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build API
        working-directory: ./server
        run: dotnet build --configuration Release

      - name: Publish API
        working-directory: ./server
        run: dotnet publish -c Release -o "${{ runner.temp }}/publish"

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: net-app-binaries
          path: ${{ runner.temp }}/publish
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download published API
        uses: actions/download-artifact@v4
        with:
          name: net-app-binaries
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E706E94E2F24D78976C9191D4BC46AB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BC6D43C4A8D04EB489FB64583E521B81 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_09B5E4DCD05D44FDA78E29A4925F9E88 }}

      - name: Deploy API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ng-ecommerce-api'
          package: ./publish
